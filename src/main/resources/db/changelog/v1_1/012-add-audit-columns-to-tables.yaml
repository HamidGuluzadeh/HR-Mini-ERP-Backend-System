databaseChangeLog:
  - changeSet:
      id: 012-add-audit-columns-to-tables-2026-11-03
      author: Hamid Guluzadeh
      changes:
        - addColumn:
            tableName: departments
            columns:
              - column:
                  name: created_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: VARCHAR(36)

        - addColumn:
