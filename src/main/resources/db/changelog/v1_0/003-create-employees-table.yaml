databaseChangeLog:
  - changeSet:
      id: 003-create-employees-table-2026-09-25
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(100)

              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: termination_date
                  type: DATE

              - column:
                  name: position_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_employees_position
                    referencedTableName: positions
                    referencedColumnNames: id

              - column:
                  name: manager_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_employees_manager
                    referencedTableName: employees
                    referencedColumnNames: id

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP