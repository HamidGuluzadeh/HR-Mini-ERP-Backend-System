databaseChangeLog:
  - changeSet:
      id: 002-create-positions-table-2026-09-25
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: positions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: department_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_positions_department
                    referencedTableName: departments
                    referencedColumnNames: id

              - column:
                  name: min_salary
                  type: DECIMAL(6, 2)

              - column:
                  name: max_salary
                  type: DECIMAL(6, 2)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP