databaseChangeLog:
  - changeSet:
      id: 009-create-payrolls-table-2026-09-26
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: payrolls
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payrolls_employee
                    referencedTableName: employees
                    referencedColumnNames: id

              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: base_salary
                  type: DECIMAL(6, 2)
                  constraints:
                    nullable: false

              - column:
                  name: bonus
                  type: DECIMAL(5, 2)
                  defaultValueNumeric: 0.00

              - column:
                  name: deductions
                  type: DECIMAL(6, 2)
                  defaultValueNumeric: 0.00

              - column:
                  name: net_salary
                  type: DECIMAL(6, 2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP