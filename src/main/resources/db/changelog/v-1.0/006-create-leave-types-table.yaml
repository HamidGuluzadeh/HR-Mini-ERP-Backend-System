databaseChangeLog:
  - changeSet:
      id: 006-create-leave-types-table-2026-09-26
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: leave_types
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: max_days_per_year
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: is_paid
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP