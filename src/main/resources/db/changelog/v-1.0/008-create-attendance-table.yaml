databaseChangeLog:
  - changeSet:
      id: 008-create-attendance-table-2026-09-26
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: attendance
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    uniqueConstraintName: uk_employee_work_date
                    foreignKeyName: fk_attendance_employee
                    referencedTableName: employees
                    referencedColumnNames: id

              - column:
                  name: work_date
                  type: DATE
                  constraints:
                    nullable: false
                    uniqueConstraintName: uk_employee_work_date

              - column:
                  name: check_in
                  type: TIMESTAMP

              - column:
                  name: check_out
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PRESENT
                  constraints:
                    nullable: false