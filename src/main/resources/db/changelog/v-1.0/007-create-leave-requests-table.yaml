databaseChangeLog:
  - changeSet:
      id: 007-create-leave-requests-table-2026-09-26
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: leave_requests
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_requests_employee
                    referencedTableName: employees
                    referencedColumnNames: id

              - column:
                  name: leave_type_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_requests_type
                    referencedTableName: leave_types
                    referencedColumnNames: id

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: total_days
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: approved_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_leave_requests_approver
                    referencedTableName: employees
                    referencedColumnNames: id

              - column:
                  name: reason
                  type: VARCHAR(500)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP