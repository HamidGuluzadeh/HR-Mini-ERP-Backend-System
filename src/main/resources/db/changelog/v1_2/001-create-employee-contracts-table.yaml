databaseChangeLog:
  - changeSet:
      id: 001-create-employee-contracts-table-2026-11-08
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: employee_contracts
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contract_employee
                    referencedTableName: employees
                    referencedColumnNames: id

              - column:
                  name: salary_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: base_salary
                  type: DECIMAL(8, 2)
                  constraints:
                    nullable: true

              - column:
                  name: hourly_rate
                  type: DECIMAL(6, 2)
                  constraints:
                    nullable: true

              - column:
                  name: effective_from
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: effective_to
                  type: DATE

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: updated_by
                  type: VARCHAR(36)