version: '3.9'

services:
  postgres:
    image: postgres:18
    container_name: hr_erp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_hr_data:/var/lib/postgresql/data
    networks:
      - hr_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hr_erp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - hr_network

networks:
  hr_network:
    driver: bridge

volumes:
  postgres_hr_data:
    driver: local
  